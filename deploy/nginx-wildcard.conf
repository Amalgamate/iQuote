# =============================================================
# iQuote — Wildcard tenant subdomain Nginx config
# =============================================================
# This handles *.trendscore.co.ke for tenant workspaces.
# Each tenant gets a subdomain like business.trendscore.co.ke.
#
# Placed at /etc/nginx/sites-available/iquote-wildcard.trendscore.co.ke
# Requires a wildcard SSL certificate for *.trendscore.co.ke.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name *.trendscore.co.ke;

    client_max_body_size 10m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
