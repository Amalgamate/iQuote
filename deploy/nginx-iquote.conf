# =============================================================
# iQuote — Nginx reverse proxy config
# =============================================================
# This file is placed at /etc/nginx/sites-available/iquote.trendscore.co.ke
# and symlinked into sites-enabled.
#
# The iQuote web container listens on host port 5180.
# All /api and /uploads traffic is handled by the web container's
# internal Nginx, which proxies to the API container.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name iquote.trendscore.co.ke www.iquote.trendscore.co.ke;

    client_max_body_size 10m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ACME challenge (Certbot will manage this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
