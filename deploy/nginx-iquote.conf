# =============================================================
# iQuote — Nginx reverse proxy config
# =============================================================
# This file is placed at /etc/nginx/sites-available/iquote.trendscore.co.ke
# and symlinked into sites-enabled by deploy/deploy.sh on every deploy.
#
# The iQuote web container listens on host port 5180.
# All /api and /uploads traffic is handled by the web container's
# internal Nginx, which proxies to the API container.
#
# IMPORTANT: this deployment shares the host with other sites that also
# listen on 443. If this file has no TLS server block, TLS handshakes for
# iquote.trendscore.co.ke are served by whichever site nginx picks first
# (in practice zayan.trendscore.co.ke), which shows the wrong certificate
# and the wrong app. The HTTPS block below is therefore mandatory.
#
# The certificate is issued by deploy/provision-ssl.sh (certbot, webroot).
# If it is ever missing, disable ONLY the 443 block — do not delete this
# file — otherwise nginx refuses to start and every site goes down.
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name iquote.trendscore.co.ke www.iquote.trendscore.co.ke;

    client_max_body_size 10m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ACME challenge (Certbot manages this). Must stay plain HTTP so that
    # renewals work even if the certificate has expired.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else goes to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iquote.trendscore.co.ke www.iquote.trendscore.co.ke;

    ssl_certificate     /etc/letsencrypt/live/iquote.trendscore.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iquote.trendscore.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Keep the ACME path reachable over TLS too (certbot may validate either way).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
