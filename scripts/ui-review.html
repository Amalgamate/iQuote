<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>iQuote UI direction review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1ef;color:#182923;font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.reviewbar{height:66px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:18px;padding:0 22px;background:#fff;border-bottom:1px solid #dce4df;box-shadow:0 2px 10px #183b2b0b}.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:750;letter-spacing:-.4px;white-space:nowrap}.mark{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;color:#fff;background:#176b4b;font-size:11px;font-weight:800}.hint{color:#728078;font-size:11px;white-space:nowrap}.tabs{display:flex;gap:5px;margin:auto}.tab,.size{border:1px solid transparent;border-radius:7px;background:transparent;color:#64736c;padding:9px 12px;font:600 12px inherit;cursor:pointer}.tab:hover,.size:hover{background:#f1f5f2;color:#24382e}.tab.active{background:#e8f3ec;color:#155c40;border-color:#d4e7db}.viewtools{display:flex;align-items:center;gap:3px;border-left:1px solid #e4eae6;padding-left:14px}.size.active{background:#1e3429;color:white}.stage{height:calc(100vh - 66px);display:flex;justify-content:center;align-items:stretch;padding:14px}.framewrap{width:100%;height:100%;background:#fff;border:1px solid #dce3df;border-radius:10px;box-shadow:0 10px 40px #16382912;overflow:hidden;transition:width .2s}.framewrap.tablet{width:min(900px,100%)}.framewrap.mobile{width:390px;height:min(820px,100%);border:8px solid #18231e;border-radius:24px;box-shadow:0 18px 55px #18231e30}.frame{width:100%;height:100%;border:0;background:#fff}.mobile-label{display:none;position:fixed;bottom:11px;left:50%;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:#20352b;color:#fff;font-size:10px;opacity:.8}.framewrap.mobile~.mobile-label{display:block}@media(max-width:850px){.reviewbar{gap:8px;padding:0 10px}.hint{display:none}.brand{font-size:13px}.tab{padding:8px 9px;font-size:11px}.viewtools{padding-left:6px}.size{padding:8px 7px;font-size:10px}}@media(max-width:580px){.reviewbar{height:auto;min-height:64px;flex-wrap:wrap;padding:8px 10px}.tabs{order:3;width:100%;justify-content:center}.stage{height:calc(100vh - 104px);padding:8px}.viewtools{margin-left:auto}.tab{flex:1;text-align:center}.framewrap.mobile{width:100%;height:100%;border-width:5px;border-radius:18px}}
</style>
</head>
<body>
<header class="reviewbar">
  <div class="brand"><span class="mark">iQ</span><span>iQuote <span style="font-weight:450;color:#78857e">· UI direction</span></span></div>
  <div class="hint">Static concepts · sample data · no live actions</div>
  <nav class="tabs" aria-label="Choose a mockup">
    <button class="tab active" data-src="public-site-mockup.html">Public website</button>
    <button class="tab" data-src="customer-dashboard-mockup.html">Business dashboard</button>
    <button class="tab" data-src="admin-dashboard-mockup.html">Platform admin</button>
  </nav>
  <div class="viewtools" aria-label="Preview width">
    <button class="size active" data-size="wide" title="Desktop preview">Desktop</button>
    <button class="size" data-size="tablet" title="Tablet preview">Tablet</button>
    <button class="size" data-size="mobile" title="Mobile preview">Mobile</button>
  </div>
</header>
<main class="stage">
  <div class="framewrap"><iframe class="frame" title="Selected iQuote UI mockup" src="public-site-mockup.html"></iframe></div>
  <div class="mobile-label">390 px mobile preview</div>
</main>
<script>
const frame=document.querySelector('.frame');
const wrap=document.querySelector('.framewrap');
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===button));
  frame.src=button.dataset.src;
}));
document.querySelectorAll('.size').forEach(button=>button.addEventListener('click',()=>{
  document.querySelectorAll('.size').forEach(item=>item.classList.toggle('active',item===button));
  wrap.className='framewrap'+(button.dataset.size==='wide'?'':` ${button.dataset.size}`);
}));
</script>
</body>
</html>
