<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#143d2c" />
    <title>Offline · iQuote</title>
    <style>
      :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #183428; background: #f3f7f4; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; box-sizing: border-box; }
      main { width: min(460px, 100%); padding: 30px; border: 1px solid #e0e9e2; border-radius: 16px; background: white; box-shadow: 0 16px 50px #193b2910; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
      .mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 10px; background: #13795b; color: white; font-size: 15px; }
      h1 { margin: 28px 0 8px; font-size: 25px; letter-spacing: -.04em; }
      p { margin: 0; color: #66756c; }
      button { margin-top: 22px; padding: 10px 16px; border: 0; border-radius: 8px; background: #13795b; color: white; font: inherit; font-weight: 650; cursor: pointer; }
      small { display: block; margin-top: 15px; color: #86928a; }
    </style>
  </head>
  <body><main><div class="brand"><span class="mark">Q.</span>iQuote</div><h1>You’re offline</h1><p>Reconnect to the internet to load your workspace and securely sync quote changes. Private quote and customer data isn’t stored on this device for offline use.</p><button type="button" onclick="location.reload()">Try again</button><small>iQuote works best with an active internet connection.</small></main></body>
</html>
