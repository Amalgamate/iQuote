services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iquote
      POSTGRES_PASSWORD: iquote
      POSTGRES_DB: iquote
    ports:
      - "5433:5432"
    volumes:
      - iquote_pg:/var/lib/postgresql/data

  api:
    image: node:20-bookworm-slim
    working_dir: /app
    depends_on:
      - db
    environment:
      PORT: 4000
      NODE_ENV: development
      JWT_SECRET: dev-secret-change-me
      DATABASE_URL: postgresql://iquote:iquote@db:5432/iquote?schema=public
    volumes:
      - ./api:/app
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npm run dev"
    ports:
      - "4000:4000"

  web:
    image: node:20-bookworm-slim
    working_dir: /app
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  iquote_pg:
